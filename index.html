<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Перекуп BMW — кликер-симулятор перекупщика: пройди всю историю BMW от Dixi 1928 года до Neue Klasse." />
    <meta name="theme-color" content="#07090d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Перекуп BMW</title>

    <!-- Yandex Games SDK -->
    <script src="https://yandex.ru/games/sdk/v2"></script>

    <style>
      /* Заглушка загрузки — показывается до готовности React-приложения */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #07090d;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #07090d;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #eef2f8;
        z-index: 999;
        transition: opacity 0.4s ease;
      }
      #boot .ring {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #1c69d4;
        animation: spin 0.9s linear infinite;
        margin: 0 auto 16px;
      }
      #boot .t {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
        text-align: center;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div><div class="ring"></div><div class="t">Прогреваем мотор</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
